name: money-tracker

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - application

  migrate:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/money-tracker/api:${API_IMAGE_TAG:-latest}
    pull_policy: always
    command: ['node', 'dist/database/migrate.js']
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application

  api:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/money-tracker/api:${API_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: ${API_NODE_ENV:-production}
      API_PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_FILE: /app/logs/api.log
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-86400}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-__Host-mt_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?Set AUTH_ALLOWED_ORIGINS}
      AUTH_TRUST_PROXY: ${AUTH_TRUST_PROXY:-true}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Kyiv}
    ports:
      - '3001:3001'
    volumes:
      - api-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - application

  web:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/money-tracker/web:${WEB_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - application

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.18.0}
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      LOKI_URL: ${LOKI_URL:-http://observability-loki:3100/loki/api/v1/push}
      LOKI_TENANT_ID: ${LOKI_TENANT_ID:-tenant1}
    ports:
      - '127.0.0.1:12346:12345'
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - api-logs:/var/log/money-tracker:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      api:
        condition: service_healthy
    networks:
      - observability

networks:
  application:
  observability:
    external: true
    name: observability_observability

volumes:
  postgres-data:
  api-logs:
  alloy-data:
