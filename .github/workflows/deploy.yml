name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build-and-push:
    name: Build and push ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/money-tracker/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR registry
        id: aws
        shell: bash
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          PROJECT_DIR: ${{ vars.EC2_PROJECT_DIR }}
          DEPLOY_USER: ${{ vars.EC2_DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.aws.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${INSTANCE_ID:?Set the EC2_INSTANCE_ID repository variable}"
          : "${PROJECT_DIR:?Set the EC2_PROJECT_DIR repository variable}"
          : "${DEPLOY_USER:=ubuntu}"

          remote_command=$(cat <<EOF
          set -Eeuo pipefail
          sudo -u '${DEPLOY_USER}' -H git -C '${PROJECT_DIR}' fetch --prune origin
          sudo -u '${DEPLOY_USER}' -H git -C '${PROJECT_DIR}' checkout --detach '${DEPLOY_SHA}'
          test "\$(sudo -u '${DEPLOY_USER}' -H git -C '${PROJECT_DIR}' rev-parse HEAD)" = '${DEPLOY_SHA}'
          sudo -u '${DEPLOY_USER}' -H bash '${PROJECT_DIR}/scripts/deploy-ec2.sh' '${DEPLOY_SHA}' '${AWS_REGION}' '${ECR_REGISTRY}'
          EOF
          )

          parameters=$(jq -cn --arg command "$remote_command" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy money-tracker ${DEPLOY_SHA}" \
            --parameters "$parameters" \
            --query Command.CommandId \
            --output text)

          status=Pending
          for attempt in $(seq 1 90); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)

            case "$status" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          if [[ "$status" != Success ]]; then
            echo "SSM deployment finished with status: $status" >&2
            exit 1
          fi
