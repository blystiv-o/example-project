name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

#      - name: Setup Node.js
#        uses: actions/setup-node@v6
#        with:
#          node-version: 22.14.0
#          cache: npm
#
#      - name: Install dependencies
#        run: npm ci
#
#      - name: Lint
#        run: npm run lint
#
#      - name: Typecheck
#        run: npm run typecheck
#
#      - name: Test
#        run: npm test

  build-and-push:
    name: Build and push ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          # - web  # Тимчасово вимкнено CI/CD для web.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/money-tracker/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR registry
        id: aws
        shell: bash
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Deploy through SSH
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          SSH_PORT: ${{ vars.EC2_SSH_PORT }}
          PROJECT_DIR: ${{ vars.EC2_PROJECT_DIR }}
          DEPLOY_USER: ${{ vars.EC2_DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.aws.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${EC2_HOST:?Set the EC2_HOST repository variable}"
          : "${PROJECT_DIR:?Set the EC2_PROJECT_DIR repository variable}"
          : "${SSH_PRIVATE_KEY:?Set the EC2_SSH_PRIVATE_KEY production secret}"
          : "${SSH_KNOWN_HOSTS:?Set the EC2_KNOWN_HOSTS production secret}"
          : "${DEPLOY_USER:=ec2-user}"
          : "${SSH_PORT:=22}"

          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$PROJECT_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]

          ssh_directory="$RUNNER_TEMP/money-tracker-ssh"
          install -m 700 -d "$ssh_directory"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_directory/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_directory/known_hosts"
          chmod 600 "$ssh_directory/deploy_key" "$ssh_directory/known_hosts"

          ssh \
            -i "$ssh_directory/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_directory/known_hosts" \
            "$DEPLOY_USER@$EC2_HOST" \
            bash -s -- "$PROJECT_DIR" "$DEPLOY_SHA" "$AWS_REGION" "$ECR_REGISTRY" <<'REMOTE'
          set -Eeuo pipefail

          project_dir=$1
          deploy_sha=$2
          aws_region=$3
          ecr_registry=$4

          git -C "$project_dir" fetch --prune origin
          git -C "$project_dir" checkout --detach "$deploy_sha"
          test "$(git -C "$project_dir" rev-parse HEAD)" = "$deploy_sha"
          bash "$project_dir/scripts/deploy-ec2.sh" "$deploy_sha" "$aws_region" "$ecr_registry"
          REMOTE
